name: Generate documentation for Arcade

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-uml:
    if: github.repository == 'Valtyyy/arcade-mirror'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: |
          doxygen Doxyfile

      - name: Move UML images
        run: |
          mkdir -p docs
          find docs/html -name "*.svg" -exec cp {} docs/uml/ \;

      - name: Commit UML diagrams
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Auto-generate UML diagrams [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:main
