name: Arcade CI/CD

on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

env:
  MIRROR_URL: "git@github.com:EpitechPGE2-2025/G-OOP-400-PAR-4-1-arcade-3.git"

jobs:
  build:
    name: Check compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libcriterion-dev cmake build-essential

      - name: Configure CMake
        run: |
          cmake -B build -S .

      - name: Build project
        run: |
          cmake --build build

